name: CI Pipeline

on:
  push:
    # branches: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    # Unit tests should run only after lint succeeds
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  build:
    # Build should run only after lint succeeds
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      # Problem 4: no upload-artifact step — dist/ is never saved
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with: 
          name: app-build
          path: dist/

  integration-tests:
    # Integration tests require the build output from the build job
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # Problem 2: no download-artifact — dist/ does not exist on this machine
      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist/
      - run: npm run test:integration

  deploy-staging:
    # Deploy only after unit tests and integration tests pass
    needs:
      - unit-tests
      - integration-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Problem 3: no if condition — runs on every branch
    steps:
      - run: echo "Deploying to staging environment"

  deploy-production:
    # Deploy to production only after staging deployment succeeds
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "Deploying to production environment"

  notify:
    runs-on: ubuntu-latest
    # Problem 6: no if: always() — skipped when upstream fails
    if: always()
    steps:
      - run: echo "Pipeline notification sent"
